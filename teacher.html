<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <!-- CRITICAL: Prevents auto-zoom and shaking -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>Faculty Admin | TTU Engineering</title>
    
    <link rel="manifest" href="manifest.json">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --ttu-blue: #004085;
            --ttu-gold: #ffc107;
            --ttu-light-blue: #e0f2fe;
            --ttu-text: #1e293b;
            --ttu-sidebar: #ffffff;
            --ttu-bg: #f4f7fa;
            --ttu-success: #10b981;
        }

        #adminWrapper { display: none; }
        
        /* Prevents shaking when menu is open */
        body.menu-open { 
            overflow: hidden; 
            position: fixed; 
            width: 100%; 
        }

        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--ttu-bg); 
            margin: 0; 
            width: 100vw; 
            overflow-x: hidden; 
            color: var(--ttu-text);
            -webkit-tap-highlight-color: transparent;
        }

        /* --- Login Screen --- */
        .login-screen { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: linear-gradient(135deg, var(--ttu-blue) 0%, #001a35 100%); 
            position: fixed; width: 100%; top: 0; left: 0; z-index: 9999; 
        }
        .login-card { 
            background: white; padding: 3rem 2rem; border-radius: 2rem; 
            width: 85%; max-width: 350px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
        }

        /* --- STABLE SIDEBAR --- */
        .sidebar { 
            width: 310px; background: var(--ttu-sidebar); height: 100vh; 
            padding: 25px; border-right: 1px solid #e2e8f0; position: fixed; 
            top: 0; left: 0; box-sizing: border-box; overflow-y: auto; 
            /* Hardware acceleration for smooth, non-shaky motion */
            transform: translate3d(0, 0, 0);
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); 
            z-index: 4000;
        }

        .content { margin-left: 310px; padding: 40px; transition: 0.3s ease; width: auto; }

        @media (max-width: 1024px) {
            .sidebar { transform: translate3d(-100%, 0, 0); }
            .sidebar.active { transform: translate3d(0, 0, 0); box-shadow: 20px 0 50px rgba(0,0,0,0.2); }
            .content { margin-left: 0; padding: 20px; padding-top: 80px; }
            .menu-toggle { display: flex !important; }
        }

        /* --- Stat Cards --- */
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 18px; border-radius: 1.2rem; border: 1px solid #f1f5f9; display: flex; align-items: center; gap: 12px; }
        
        /* --- Inputs (Strict 16px to prevent zoom shaking) --- */
        label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-top: 14px; display: block; }
        input, select { 
            width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #e2e8f0; 
            border-radius: 12px; font-size: 16px; background: #f8fafc; color: var(--ttu-text);
            appearance: none; -webkit-appearance: none;
        }

        .btn { 
            padding: 14px; width: 100%; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: 700; margin-top: 12px; transition: 0.2s;
            display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px;
        }
        .btn-blue { background: var(--ttu-blue); color: white; }
        .btn-green { background: var(--ttu-success); color: white; }
        .btn-red { background: #f1f5f9; color: #ef4444; font-size: 13px; margin-top: 25px; }

        /* --- Fixed Table Container --- */
        .table-container { 
            background: white; border-radius: 1.2rem; overflow-x: auto; 
            border: 1px solid #e2e8f0; -webkit-overflow-scrolling: touch;
        }
        table { width: 100%; border-collapse: collapse; min-width: 450px; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 11px; color: #64748b; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }

        /* --- Stable Floating Toggle --- */
        .menu-toggle {
            display: none; position: fixed; bottom: 25px; right: 25px; 
            background: var(--ttu-blue); color: white; border: none; 
            width: 60px; height: 60px; border-radius: 50%; 
            align-items: center; justify-content: center; z-index: 5000;
            box-shadow: 0 10px 25px rgba(0,64,133,0.3);
        }
        .sidebar-overlay { 
            display: none; position: fixed; top:0; left:0; width:100%; height:100%; 
            background: rgba(0,0,0,0.4); z-index: 3500; backdrop-filter: blur(3px); 
        }
        .sidebar-overlay.active { display: block; }

        #qrImage { width: 150px; height: 150px; margin: 15px auto; display: block; border-radius: 15px; padding: 5px; background: white; border: 1px solid #eee; }
        .verified-badge { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }
        .pulse-dot { width: 8px; height: 8px; background: var(--ttu-success); border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.4; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div style="font-size: 40px; margin-bottom: 10px;">🏛️</div>
            <h2 style="color: var(--ttu-blue); margin:0;">TTU Admin</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 25px;">Faculty Management Login</p>
            <input type="password" id="adminPass" placeholder="System Password">
            <button class="btn btn-blue" onclick="verifyAdmin()">Enter Portal</button>
        </div>
    </div>

    <div id="adminWrapper">
        <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
        <button class="menu-toggle" id="mBtn" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

        <div class="sidebar" id="sidebar">
            <h3 style="color: var(--ttu-blue); margin:0 0 20px 0; display: flex; align-items: center; gap: 8px;">
                <i data-lucide="shield-check"></i> Admin Panel
            </h3>
            
            <label>Level</label>
            <select id="levelInput" onchange="contextChanged()"><option>100</option><option>200</option><option selected>300</option><option>400</option></select>
            
            <label>Department</label>
            <select id="deptInput" onchange="contextChanged()"><option>Mechanical</option><option>Electrical</option><option>Civil</option><option>Petroleum</option></select>

            <hr style="margin:20px 0; border: 0; border-top: 1px solid #f1f5f9;">
            
            <label>Course History</label>
            <select id="courseHistorySelector" onchange="loadCourseFromHistory()"></select>
            
            <label>Section</label>
            <select id="sectionInput" onchange="autoLoadLecturer(); refresh();"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select>

            <label>Course Name</label>
            <input type="text" id="classNameInput" placeholder="eg. Applied Thermodynamics" oninput="refresh()">

            <label>Lecturer Name</label>
            <input type="text" id="lecturerNameInput" placeholder="Lecturer Name">

            <label>Records for Date</label>
            <input type="date" id="dateFilter" onchange="refresh()">
            
            <img id="qrImage">
            
            <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()"><i data-lucide="map-pin"></i> Sync GPS</button>
            <button class="btn btn-green" onclick="downloadCSV()"><i data-lucide="file-text"></i> Export CSV</button>
            <button class="btn btn-red" onclick="location.reload()">🔒 Logout</button>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card">
                    <div style="background: #e0f2fe; color: #0369a1; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;"><i data-lucide="users" size="20"></i></div>
                    <div><label style="margin:0">Present</label><div style="font-size: 22px; font-weight: 800;" id="count">0</div></div>
                </div>
                <div class="stat-card">
                    <div style="background: #dcfce7; color: #15803d; width: 40px; height: 40px; border-radius: 10px; display: flex; align-items: center; justify-content: center;"><i data-lucide="activity" size="20"></i></div>
                    <div><label style="margin:0">Status</label><div style="font-size: 13px; font-weight: 700; color: var(--ttu-success);"><span class="pulse-dot"></span> LIVE</div></div>
                </div>
            </div>

            <h2 id="mainTitle" style="margin:0 0 5px; color: var(--ttu-blue); font-size: 22px;">Attendance Log</h2>
            <p id="subTitle" style="color:#64748b; margin-bottom: 20px; font-size: 13px;"></p>
            
            <div class="table-container">
                <table>
                    <thead><tr><th>Time</th><th>Student Name</th><th>Index</th><th>Status</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        let allSavedClasses = [];
        
        window.toggleSidebar = () => {
            const isAct = document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.body.classList.toggle('menu-open'); // LOCK BACKGROUND
            document.getElementById('mBtn').innerHTML = isAct ? '<i data-lucide="x"></i>' : '<i data-lucide="menu"></i>';
            lucide.createIcons();
        };

        window.verifyAdmin = () => {
            if (document.getElementById('adminPass').value === "TTUattendance@50") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminWrapper').style.display = "block";
                loadAllClassesFromDB(); refresh(); lucide.createIcons();
            } else alert("Denied");
        };

        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];
        window.contextChanged = () => { document.getElementById('classNameInput').value = ""; document.getElementById('lecturerNameInput').value = ""; updateHistoryList(); refresh(); };

        async function loadAllClassesFromDB() {
            const { data } = await supabase.from('classes').select('*').order('name');
            if (data) { allSavedClasses = data; updateHistoryList(); }
        }

        window.updateHistoryList = () => {
            const level = document.getElementById('levelInput').value, dept = document.getElementById('deptInput').value;
            const matches = allSavedClasses.filter(c => c.level === level && c.department === dept);
            const uniqueNames = [...new Set(matches.map(c => c.name))];
            const sel = document.getElementById('courseHistorySelector');
            sel.innerHTML = uniqueNames.length > 0 ? '<option value="">-- Select Course --</option>' : '<option value="">-- No matches --</option>';
            uniqueNames.forEach(n => { const o = document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o); });
        };

        window.loadCourseFromHistory = () => {
            const n = document.getElementById('courseHistorySelector').value;
            if (!n) return; document.getElementById('classNameInput').value = n; autoLoadLecturer();
        };

        window.autoLoadLecturer = () => {
            const n = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value;
            if (!n) return;
            const match = allSavedClasses.find(c => c.name === n && c.section === s && c.level === l && c.department === d);
            if (match) document.getElementById('lecturerNameInput').value = match.lecturer_name;
            else { const generic = allSavedClasses.find(c => c.name === n && c.level === l && c.department === d); document.getElementById('lecturerNameInput').value = generic ? generic.lecturer_name : ""; }
            refresh();
        };

        window.refresh = async () => {
            const l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value, c = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, dt = document.getElementById('dateFilter').value;
            const cid = `${d}_${l}_${c.replace(/\s+/g, '_')}_${s}`.toLowerCase();
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent('https://ttu-attendance-portal.github.io/attendance-system/?class='+cid)}`;
            if (!c) return;
            const st = `${dt}T00:00:00.000Z`, en = `${dt}T23:59:59.999Z`;
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).gte('created_at', st).lte('created_at', en).order('created_at', {ascending: false});
            document.getElementById('count').innerText = data ? data.length : 0;
            document.getElementById('mainTitle').innerText = c;
            document.getElementById('subTitle').innerText = `${d} | L${l} | Sec ${s}`;
            if (data) document.getElementById('list').innerHTML = data.map(x => `<tr><td style="color:#64748b; font-size:12px;">${new Date(x.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${x.student}</b></td><td><code style="background:#f1f5f9; padding:4px 8px; border-radius:6px;">${x.index_number}</code></td><td><span class="verified-badge"><i data-lucide="check" size="10"></i> VERIFIED</span></td></tr>`).join('') || "<tr><td colspan='4' style='text-align:center; padding:40px; color:#94a3b8;'>Empty.</td></tr>";
            lucide.createIcons();
        };

        window.updateRoomGPS = () => {
            const l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value, c = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, lec = document.getElementById('lecturerNameInput').value;
            if(!c || !lec) return alert("Missing Details");
            const cid = `${d}_${l}_${c.replace(/\s+/g, '_')}_${s}`.toLowerCase();
            const btn = document.getElementById('gpsBtn'); btn.innerHTML = "⏳ Syncing GPS..."; btn.disabled = true;
            navigator.geolocation.getCurrentPosition(async (p) => {
                await supabase.from('classes').upsert({ id: cid, name: c, department: d, level: l, section: s, lecturer_name: lec, lat: p.coords.latitude, lng: p.coords.longitude });
                alert("GPS Synchronized!"); if(window.innerWidth < 1024) toggleSidebar(); loadAllClassesFromDB(); refresh(); btn.innerHTML = '<i data-lucide="map-pin"></i> Sync GPS'; btn.disabled = false;
                lucide.createIcons();
            }, (e) => { alert("GPS Lock Failed"); btn.disabled = false; }, {enableHighAccuracy:true});
        };

        window.downloadCSV = () => {
            let csv = "Time,Name,Index\n";
            document.querySelectorAll("#list tr").forEach(tr => { if (tr.cells.length > 1) csv += `${tr.cells[0].innerText},${tr.cells[1].innerText},${tr.cells[2].innerText}\n`; });
            const b = new Blob([csv], { type: 'text/csv' });
            const ln = document.createElement("a"); ln.href = URL.createObjectURL(b); ln.download = `Report.csv`; ln.click();
        };

        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => refresh()).subscribe();
    </script>
</body>
</html>

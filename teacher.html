<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Admin Dashboard | TTU Portal</title>
    <style>
        #adminWrapper { display: none; }
        body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: #f8fafc; margin: 0; padding: 0; width: 100vw; overflow-x: hidden; -webkit-font-smoothing: antialiased; }
        
        /* Login Page */
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #004085; position: fixed; width: 100%; top: 0; z-index: 5000; }
        .login-card { background: white; padding: 2rem; border-radius: 1rem; width: 85%; max-width: 320px; text-align: center; box-shadow: 0 20px 25px rgba(0,0,0,0.2); }
        
        /* Sidebar Overlay for Mobile */
        .sidebar-overlay { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.5); z-index: 2500; }
        .sidebar-overlay.active { display: block; }

        /* The Sidebar */
        .sidebar { 
            width: 300px; background: white; height: 100vh; padding: 25px; border-right: 1px solid #e2e8f0; 
            position: fixed; top: 0; left: 0; box-sizing: border-box; overflow-y: auto; 
            transition: transform 0.3s cubic-bezier(0.4, 0, 0.2, 1); z-index: 3000;
        }

        /* Mobile Adjustments */
        @media (max-width: 768px) {
            .sidebar { transform: translateX(-100%); width: 280px; }
            .sidebar.active { transform: translateX(0); }
            .content { margin-left: 0 !important; padding: 15px !important; padding-top: 20px !important; }
            .menu-toggle { display: flex !important; }
        }

        .menu-toggle {
            display: none; position: fixed; bottom: 25px; right: 25px; 
            background: #004085; color: white; border: none; width: 60px; height: 60px;
            border-radius: 50%; justify-content: center; align-items: center; font-size: 24px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 4000; cursor: pointer;
        }

        .content { margin-left: 300px; padding: 40px; box-sizing: border-box; min-height: 100vh; }

        /* Stable Form Inputs (16px prevents zoom) */
        label { font-size: 11px; font-weight: bold; color: #64748b; display: block; margin-top: 15px; text-transform: uppercase; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; font-size: 16px; -webkit-appearance: none; }
        
        .btn { padding: 14px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 12px; color: white; font-size: 15px; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #10b981; }
        .btn-red { background: #64748b; }

        /* Fixed Table Container */
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; font-size: 11px; text-transform: uppercase; }
        
        #qrImage { width: 180px; height: 180px; margin: 20px auto; display: block; border: 1px solid #eee; padding: 10px; border-radius: 10px; background: white; }
        .version { position: fixed; bottom: 5px; left: 5px; font-size: 10px; color: #cbd5e1; z-index: 10; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2 style="color:#004085; margin:0 0 10px;">TTU Admin</h2>
            <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Secure Management Portal</p>
            <input type="password" id="adminPass" placeholder="Enter Password">
            <button class="btn btn-blue" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <div id="adminWrapper">
        <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
        <button class="menu-toggle" id="mBtn" onclick="toggleSidebar()">☰</button>

        <div class="sidebar" id="sidebar">
            <h2 style="color:#004085; margin:0;">Dashboard</h2>
            
            <label>Load History</label>
            <select id="classSelector" onchange="selectSavedClass()"></select>
            
            <hr style="margin:20px 0; border:0; border-top:1px solid #f1f5f9;">
            
            <label>Current Class ID</label>
            <input type="text" id="classIdInput" value="cs101" onchange="refresh()">
            <label>Course Name</label>
            <input type="text" id="classNameInput" placeholder="eg. Applied Thermodynamics">
            <label>Record Date</label>
            <input type="date" id="dateFilter" onchange="refresh()">
            
            <img id="qrImage">
            
            <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()">📍 Set Room GPS</button>
            <button class="btn btn-green" onclick="downloadCSV()">📥 Export CSV</button>
            <button class="btn btn-red" onclick="location.reload()">🔒 Logout</button>
        </div>

        <div class="content">
            <h1 style="margin:0 0 5px; font-size: 24px;">Attendance Log</h1>
            <p style="margin:0; color:#64748b; font-size: 14px;">Showing <span id="count" style="font-weight:bold; color:#004085;">0</span> records</p>
            
            <div class="table-container">
                <table>
                    <thead><tr><th>Time</th><th>Student Name</th><th>Index</th><th>Map</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <div class="version">v2.0 - Stable</div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        let savedClasses = [];

        window.toggleSidebar = () => {
            const isActive = document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('mBtn').innerText = isActive ? '✕' : '☰';
        };

        window.verifyAdmin = () => {
            if (document.getElementById('adminPass').value === "TTUattendance@50") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminWrapper').style.display = "block";
                loadClassHistory(); refresh();
            } else { alert("Invalid Credentials"); }
        };

        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];

        async function loadClassHistory() {
            const { data } = await supabase.from('classes').select('id, name').order('name');
            if (data) {
                savedClasses = data;
                const selector = document.getElementById('classSelector');
                selector.innerHTML = '<option value="">-- Select Saved Class --</option>';
                data.forEach(c => {
                    const opt = document.createElement('option');
                    opt.value = c.id; opt.innerText = `${c.name} (${c.id})`;
                    selector.appendChild(opt);
                });
            }
        }

        window.selectSavedClass = () => {
            const val = document.getElementById('classSelector').value;
            const found = savedClasses.find(c => c.id === val);
            if (found) {
                document.getElementById('classIdInput').value = found.id;
                document.getElementById('classNameInput').value = found.name;
                if(window.innerWidth < 768) toggleSidebar();
                refresh();
            }
        };

        window.refresh = async () => {
            const cid = document.getElementById('classIdInput').value;
            const date = document.getElementById('dateFilter').value;
            const studentUrl = `https://ttu-attendance-portal.github.io/attendance-system/?class=${cid}`;
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(studentUrl)}`;
            
            const start = `${date}T00:00:00.000Z`, end = `${date}T23:59:59.999Z`;
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).gte('created_at', start).lte('created_at', end).order('created_at', {ascending: false});
            if (data) {
                document.getElementById('count').innerText = data.length;
                document.getElementById('list').innerHTML = data.map(d => `<tr><td>${new Date(d.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${d.student}</b></td><td>${d.index_number}</td><td><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank" style="color:#007bff; text-decoration:none; font-weight:bold;">📍 Map</a></td></tr>`).join('') || "<tr><td colspan='4' style='text-align:center; padding:30px; color:#94a3b8;'>No records found</td></tr>";
            }
        };

        window.updateRoomGPS = () => {
            const cid = document.getElementById('classIdInput').value;
            const cName = document.getElementById('classNameInput').value;
            if(!cName) return alert("Course Name Required");
            const btn = document.getElementById('gpsBtn');
            btn.innerText = "⏳ Verifying GPS...";
            navigator.geolocation.getCurrentPosition(async (pos) => {
                await supabase.from('classes').upsert({ id: cid, name: cName, lat: pos.coords.latitude, lng: pos.coords.longitude });
                alert("Location & Name Synchronized!"); 
                if(window.innerWidth < 768) toggleSidebar();
                loadClassHistory(); refresh();
                btn.innerText = "📍 Set Room GPS";
            }, (err) => { alert("GPS Lock Failed"); btn.innerText = "📍 Set Room GPS"; }, {enableHighAccuracy:true});
        };

        window.downloadCSV = () => {
            let csv = "Time,Name,Index,Coordinates\n";
            document.querySelectorAll("#list tr").forEach(tr => {
                if (tr.cells.length > 1) {
                    const coords = tr.cells[3].querySelector('a').href.split('q=')[1];
                    csv += `${tr.cells[0].innerText},${tr.cells[1].innerText.replace(',','')},${tr.cells[2].innerText},${coords}\n`;
                }
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `TTU_Attendance_${document.getElementById('classIdInput').value}.csv`;
            link.click();
        };

        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => refresh()).subscribe();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faculty Admin | TTU</title>
    
    <!-- PWA / App Mode Meta Tags -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#004085">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        :root { --ttu-blue: #004085; --ttu-gold: #ffc107; --bg: #f4f7fa; }
        #adminWrapper { display: none; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); margin: 0; width: 100vw; overflow-x: hidden; }
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: var(--ttu-blue); position: fixed; width: 100%; top: 0; z-index: 5000; }
        .login-card { background: white; padding: 3rem; border-radius: 2rem; width: 85%; max-width: 320px; text-align: center; }
        .sidebar { width: 320px; background: white; height: 100vh; padding: 25px; border-right: 1px solid #e2e8f0; position: fixed; top: 0; left: 0; box-sizing: border-box; overflow-y: auto; transition: transform 0.3s ease; z-index: 3000; }
        @media (max-width: 1024px) { .sidebar { transform: translateX(-100%); } .sidebar.active { transform: translateX(0); box-shadow: 10px 0 30px rgba(0,0,0,0.1); } .content { margin-left: 0 !important; padding: 15px !important; padding-top: 80px !important; } .menu-toggle { display: flex !important; } }
        .content { margin-left: 320px; padding: 40px; }
        .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 25px; }
        .stat-card { background: white; padding: 15px; border-radius: 1rem; border: 1px solid #e2e8f0; display: flex; align-items: center; gap: 10px; }
        label { font-size: 10px; font-weight: bold; color: #64748b; display: block; margin-top: 12px; text-transform: uppercase; }
        input, select { width: 100%; padding: 11px; margin-top: 5px; border: 1px solid #ddd; border-radius: 10px; font-size: 16px; }
        .btn { padding: 14px; width: 100%; border: none; border-radius: 10px; cursor: pointer; font-weight: bold; margin-top: 12px; color: white; display: flex; align-items: center; justify-content: center; gap: 8px; }
        .btn-blue { background: var(--ttu-blue); } .btn-green { background: #10b981; } .btn-red { background: #f1f5f9; color: #64748b; font-size: 12px; }
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 1.2rem; border: 1px solid #e2e8f0; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th { background: #f8fafc; padding: 15px; text-align: left; font-size: 11px; color: #64748b; text-transform: uppercase; }
        td { padding: 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        .menu-toggle { display: none; position: fixed; top: 20px; left: 20px; background: var(--ttu-blue); color: white; border: none; width: 45px; height: 45px; border-radius: 12px; align-items: center; justify-content: center; z-index: 4000; }
        #qrImage { width: 160px; height: 160px; margin: 15px auto; display: block; border: 1px solid #eee; padding: 10px; border-radius: 10px; }
        .pulse { width: 8px; height: 8px; background: #10b981; border-radius: 50%; display: inline-block; animation: pulse 2s infinite; }
        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.3; } 100% { opacity: 1; } }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2 style="color: var(--ttu-blue); margin-bottom: 25px;">Admin Portal</h2>
            <input type="password" id="adminPass" placeholder="Password">
            <button class="btn btn-blue" onclick="verifyAdmin()">Unlock</button>
        </div>
    </div>

    <div id="adminWrapper">
        <button class="menu-toggle" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

        <div class="sidebar" id="sidebar">
            <h3 style="color: var(--ttu-blue); margin-bottom: 20px;">Faculty Controls</h3>
            
            <label>History</label>
            <select id="courseHistorySelector" onchange="loadCourseFromHistory()"></select>
            
            <hr style="margin:20px 0; border: 0; border-top: 1px solid #f1f5f9;">
            
            <label>Level</label>
            <select id="levelInput" onchange="contextChanged()"><option>100</option><option>200</option><option selected>300</option><option>400</option></select>
            <label>Department</label>
            <select id="deptInput" onchange="contextChanged()"><option>Mechanical</option><option>Electrical</option><option>Civil</option><option>Petroleum</option></select>
            <label>Class Section</label>
            <select id="sectionInput" onchange="autoLoadLecturer(); refresh();"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select>
            <label>Course Name</label>
            <input type="text" id="classNameInput" placeholder="eg. Thermodynamics" oninput="refresh()">
            <label>Lecturer Name</label>
            <input type="text" id="lecturerNameInput" placeholder="Enter Name">
            <label>Filter Date</label>
            <input type="date" id="dateFilter" onchange="refresh()">
            
            <img id="qrImage">
            
            <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()"><i data-lucide="map-pin"></i> Go Live</button>
            <button class="btn btn-green" onclick="downloadCSV()"><i data-lucide="download"></i> CSV Report</button>
            <button class="btn btn-red" onclick="location.reload()"><i data-lucide="log-out"></i> Logout</button>
        </div>

        <div class="content">
            <div class="stats-grid">
                <div class="stat-card"><div><label>Total Present</label><div style="font-size: 20px; font-weight: 800;" id="count">0</div></div></div>
                <div class="stat-card"><div><label>Status</label><div style="font-size: 13px; font-weight: 700; color: #10b981;"><span class="pulse"></span> LIVE MONITORING</div></div></div>
            </div>
            <h2 id="mainTitle">Attendance Log</h2>
            <p id="subTitle" style="color:#64748b; margin-bottom: 20px; font-size: 13px;"></p>
            <div class="table-container"><table><thead><tr><th>Time</th><th>Name</th><th>Index</th><th>Status</th></tr></thead><tbody id="list"></tbody></table></div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        let allSavedClasses = [];
        window.toggleSidebar = () => document.getElementById('sidebar').classList.toggle('active');
        window.verifyAdmin = () => {
            if (document.getElementById('adminPass').value === "TTUattendance@50") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminWrapper').style.display = "block";
                loadAllClassesFromDB(); refresh(); lucide.createIcons();
            } else alert("Denied");
        };

        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];
        window.contextChanged = () => { document.getElementById('classNameInput').value = ""; document.getElementById('lecturerNameInput').value = ""; updateHistoryList(); refresh(); };

        async function loadAllClassesFromDB() {
            const { data } = await supabase.from('classes').select('*').order('name');
            if (data) { allSavedClasses = data; updateHistoryList(); }
        }

        window.updateHistoryList = () => {
            const level = document.getElementById('levelInput').value, dept = document.getElementById('deptInput').value;
            const matches = allSavedClasses.filter(c => c.level === level && c.department === dept);
            const uniqueNames = [...new Set(matches.map(c => c.name))];
            const sel = document.getElementById('courseHistorySelector');
            sel.innerHTML = uniqueNames.length > 0 ? '<option value="">-- Select Course --</option>' : '<option value="">-- Empty --</option>';
            uniqueNames.forEach(n => { const o = document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o); });
        };

        window.loadCourseFromHistory = () => {
            const n = document.getElementById('courseHistorySelector').value;
            if (!n) return; document.getElementById('classNameInput').value = n; autoLoadLecturer();
        };

        window.autoLoadLecturer = () => {
            const n = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value;
            if (!n) return;
            const match = allSavedClasses.find(c => c.name === n && c.section === s && c.level === l && c.department === d);
            if (match) document.getElementById('lecturerNameInput').value = match.lecturer_name;
            else { const generic = allSavedClasses.find(c => c.name === n && c.level === l && c.department === d); document.getElementById('lecturerNameInput').value = generic ? generic.lecturer_name : ""; }
            refresh();
        };

        window.refresh = async () => {
            const l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value, c = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, dt = document.getElementById('dateFilter').value;
            const cid = `${d}_${l}_${c.replace(/\s+/g, '_')}_${s}`.toLowerCase();
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent('https://ttu-attendance-portal.github.io/attendance-system/?class='+cid)}`;
            if (!c) return;
            const st = `${dt}T00:00:00.000Z`, en = `${dt}T23:59:59.999Z`;
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).gte('created_at', st).lte('created_at', en).order('created_at', {ascending: false});
            document.getElementById('count').innerText = data ? data.length : 0;
            document.getElementById('mainTitle').innerText = c;
            document.getElementById('subTitle').innerText = `${d} L${l} | Sec ${s} | ${document.getElementById('lecturerNameInput').value}`;
            if (data) document.getElementById('list').innerHTML = data.map(x => `<tr><td style="color:#64748b; font-size:12px;">${new Date(x.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${x.student}</b></td><td><code>${x.index_number}</code></td><td><span style="color:#10b981; font-weight:bold; font-size:11px;">VERIFIED</span></td></tr>`).join('') || "<tr><td colspan='4' style='text-align:center; padding:30px; color:#94a3b8;'>Empty.</td></tr>";
        };

        window.updateRoomGPS = () => {
            const l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value, c = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, lec = document.getElementById('lecturerNameInput').value;
            if(!c || !lec) return alert("Missing Details");
            const cid = `${d}_${l}_${c.replace(/\s+/g, '_')}_${s}`.toLowerCase();
            const btn = document.getElementById('gpsBtn'); btn.innerText = "⏳ Locating..."; btn.disabled = true;
            navigator.geolocation.getCurrentPosition(async (p) => {
                await supabase.from('classes').upsert({ id: cid, name: c, department: d, level: l, section: s, lecturer_name: lec, lat: p.coords.latitude, lng: p.coords.longitude });
                alert("Activated!"); if(window.innerWidth < 1024) toggleSidebar(); loadAllClassesFromDB(); refresh(); btn.innerText = "📍 Go Live"; btn.disabled = false;
            }, (e) => { alert("GPS Fail"); btn.disabled = false; }, {enableHighAccuracy:true});
        };

        window.downloadCSV = () => {
            let csv = "Time,Name,Index\n";
            document.querySelectorAll("#list tr").forEach(tr => { if (tr.cells.length > 1) csv += `${tr.cells[0].innerText},${tr.cells[1].innerText},${tr.cells[2].innerText}\n`; });
            const b = new Blob([csv], { type: 'text/csv' });
            const ln = document.createElement("a"); ln.href = URL.createObjectURL(b); ln.download = `Report.csv`; ln.click();
        };

        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => refresh()).subscribe();
    </script>
</body>
</html>

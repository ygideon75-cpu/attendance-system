<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Dashboard</title>
    <style>
        body { font-family: sans-serif; background: #f8fafc; margin: 0; display: flex; }
        .sidebar { width: 300px; background: white; height: 100vh; padding: 25px; border-right: 1px solid #e2e8f0; position: fixed; box-sizing: border-box; }
        .content { margin-left: 300px; padding: 40px; flex-grow: 1; }
        label { font-size: 11px; font-weight: bold; color: #64748b; display: block; margin-top: 15px; text-transform: uppercase; }
        input { width: 100%; padding: 12px; margin-top: 5px; border: 1px solid #e2e8f0; border-radius: 8px; box-sizing: border-box; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        .btn { padding: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 20px; color: white; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #10b981; }
    </style>
</head>
<body>
    <div class="sidebar">
        <h2>Dashboard</h2>
        <label>Class ID</label>
        <input type="text" id="classIdInput" value="cs101" onchange="refresh()">
        <label>View Date</label>
        <input type="date" id="dateFilter" onchange="refresh()">
        
        <div style="text-align: center; margin-top: 25px;">
            <img id="qrImage" style="width: 180px; height: 180px; border: 1px solid #f1f5f9; padding: 10px;">
        </div>
        
        <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()">📍 Set Room GPS</button>
        <button class="btn btn-green" onclick="downloadCSV()">📥 Download CSV</button>
    </div>

    <div class="content">
        <h1>Attendance List (<span id="count">0</span>)</h1>
        <table>
            <thead>
                <tr><th>Time</th><th>Student Name</th><th>Index</th><th>Map</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </div>

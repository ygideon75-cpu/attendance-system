<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faculty Admin | TTU Engineering</title>
    
    <!-- PWA / App Mode -->
    <link rel="manifest" href="manifest.json">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="theme-color" content="#004085">

    <!-- Fonts & Icons -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        :root {
            --ttu-blue: #004085;
            --ttu-gold: #ffc107;
            --ttu-light-blue: #e0f2fe;
            --ttu-text: #1e293b;
            --ttu-sidebar: #ffffff;
            --ttu-bg: #f4f7fa;
            --ttu-success: #10b981;
        }

        #adminWrapper { display: none; }
        
        body { 
            font-family: 'Inter', sans-serif; 
            background: var(--ttu-bg); 
            margin: 0; 
            width: 100vw; 
            overflow-x: hidden; 
            color: var(--ttu-text);
        }

        /* --- High-End Login Screen --- */
        .login-screen { 
            display: flex; justify-content: center; align-items: center; 
            height: 100vh; background: linear-gradient(135deg, var(--ttu-blue) 0%, #001a35 100%); 
            position: fixed; width: 100%; top: 0; z-index: 5000; 
        }
        .login-card { 
            background: white; padding: 3.5rem 2rem; border-radius: 2rem; 
            width: 90%; max-width: 380px; text-align: center; 
            box-shadow: 0 25px 50px -12px rgba(0,0,0,0.5);
            animation: fadeIn 0.8s ease-out;
        }
        .portal-symbol {
            width: 80px; height: 80px; background: var(--ttu-light-blue);
            color: var(--ttu-blue); border-radius: 50%; display: flex;
            align-items: center; justify-content: center; margin: 0 auto 20px;
            box-shadow: 0 10px 20px rgba(0,0,0,0.1);
        }

        /* --- Main Dashboard Sidebar --- */
        .sidebar { 
            width: 320px; background: var(--ttu-sidebar); height: 100vh; 
            padding: 25px; border-right: 1px solid #e2e8f0; position: fixed; 
            top: 0; left: 0; box-sizing: border-box; overflow-y: auto; 
            transition: transform 0.4s cubic-bezier(0.4, 0, 0.2, 1); z-index: 3000;
        }

        .content { margin-left: 320px; padding: 40px; transition: 0.3s ease; }

        /* Responsive Fixes */
        @media (max-width: 1024px) {
            .sidebar { transform: translateX(-100%); width: 300px; }
            .sidebar.active { transform: translateX(0); box-shadow: 20px 0 50px rgba(0,0,0,0.2); }
            .content { margin-left: 0; padding: 20px; padding-top: 80px; }
            .menu-toggle { display: flex !important; }
            .sidebar-overlay.active { display: block; }
        }

        /* --- Modern Component Styling --- */
        .stats-grid { 
            display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); 
            gap: 20px; margin-bottom: 30px; 
        }
        .stat-card { 
            background: white; padding: 20px; border-radius: 1.5rem; 
            box-shadow: 0 4px 6px -1px rgba(0,0,0,0.05); 
            border: 1px solid #f1f5f9; display: flex; align-items: center; gap: 15px;
            animation: slideUp 0.5s ease-out;
        }
        .stat-icon { 
            width: 50px; height: 50px; border-radius: 15px; 
            display: flex; align-items: center; justify-content: center;
        }

        label { font-size: 10px; font-weight: 700; color: #64748b; text-transform: uppercase; margin-top: 15px; display: block; letter-spacing: 0.8px; }
        input, select { 
            width: 100%; padding: 12px; margin-top: 6px; border: 1px solid #e2e8f0; 
            border-radius: 12px; font-size: 15px; transition: 0.2s; background: #f8fafc;
            color: var(--ttu-text);
        }
        input:focus { border-color: var(--ttu-blue); outline: none; background: white; box-shadow: 0 0 0 4px rgba(0,64,133,0.05); }

        .btn { 
            padding: 14px; width: 100%; border: none; border-radius: 12px; 
            cursor: pointer; font-weight: 700; margin-top: 15px; transition: 0.3s;
            display: flex; align-items: center; justify-content: center; gap: 8px;
        }
        .btn-blue { background: var(--ttu-blue); color: white; }
        .btn-blue:hover { transform: translateY(-2px); box-shadow: 0 10px 15px -3px rgba(0,64,133,0.3); }
        .btn-green { background: var(--ttu-success); color: white; }
        .btn-red { background: #fef2f2; color: #ef4444; margin-top: 30px; font-size: 13px; }

        /* --- Modern Table --- */
        .table-container { 
            background: white; border-radius: 1.5rem; overflow: hidden; 
            box-shadow: 0 10px 15px -3px rgba(0,0,0,0.05); border: 1px solid #e2e8f0; 
        }
        table { width: 100%; border-collapse: collapse; }
        th { background: #f8fafc; padding: 18px 15px; text-align: left; font-size: 11px; color: #64748b; text-transform: uppercase; letter-spacing: 1px; }
        td { padding: 16px 15px; border-bottom: 1px solid #f1f5f9; font-size: 14px; }
        tr:last-child td { border: none; }
        .verified-badge { background: #dcfce7; color: #15803d; padding: 4px 10px; border-radius: 20px; font-size: 10px; font-weight: 800; display: inline-flex; align-items: center; gap: 4px; }

        /* --- Floating UI --- */
        .menu-toggle {
            display: none; position: fixed; bottom: 25px; right: 25px; 
            background: var(--ttu-blue); color: white; border: none; 
            width: 60px; height: 60px; border-radius: 50%; 
            align-items: center; justify-content: center; z-index: 4000;
            box-shadow: 0 10px 25px rgba(0,64,133,0.4);
        }
        .sidebar-overlay { display: none; position: fixed; top:0; left:0; width:100%; height:100%; background: rgba(0,0,0,0.4); z-index: 2500; backdrop-filter: blur(4px); }

        #qrImage { 
            width: 170px; height: 170px; margin: 25px auto; display: block; 
            border: 8px solid #f8fafc; border-radius: 20px; padding: 5px; background: white; 
        }

        /* --- Animations --- */
        .pulse-dot { 
            width: 8px; height: 8px; background: var(--ttu-success); 
            border-radius: 50%; display: inline-block;
            box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7);
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(16, 185, 129, 0); } 100% { box-shadow: 0 0 0 0 rgba(16, 185, 129, 0); } }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes slideUp { from { opacity: 0; transform: translateY(20px); } to { opacity: 1; transform: translateY(0); } }
    </style>
</head>
<body>

    <!-- 1. LOGIN SCREEN -->
    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <div class="portal-symbol"><i data-lucide="layout-dashboard" size="32"></i></div>
            <h2 style="color: var(--ttu-blue); margin:0;">Faculty Portal</h2>
            <p style="color: #64748b; font-size: 14px; margin-bottom: 30px;">Takoradi Technical University</p>
            <input type="password" id="adminPass" placeholder="Enter System Password">
            <button class="btn btn-blue" onclick="verifyAdmin()">Unlock Dashboard</button>
        </div>
    </div>

    <!-- 2. PROTECTED CONTENT -->
    <div id="adminWrapper">
        <div class="sidebar-overlay" id="overlay" onclick="toggleSidebar()"></div>
        <button class="menu-toggle" id="mBtn" onclick="toggleSidebar()"><i data-lucide="menu"></i></button>

        <div class="sidebar" id="sidebar">
            <div style="display: flex; align-items: center; gap: 12px; margin-bottom: 30px;">
                <div style="background: var(--ttu-blue); color: white; padding: 10px; border-radius: 12px;"><i data-lucide="user-check"></i></div>
                <h3 style="margin:0; font-size: 18px; color: var(--ttu-blue);">TTU Admin</h3>
            </div>
            
            <label>Context Selection</label>
            <select id="levelInput" onchange="contextChanged()"><option>100</option><option>200</option><option selected>300</option><option>400</option></select>
            <select id="deptInput" onchange="contextChanged()"><option>Mechanical</option><option>Electrical</option><option>Civil</option><option>Petroleum</option></select>

            <hr style="margin:20px 0; border: 0; border-top: 1px solid #f1f5f9;">
            
            <label>Load from History</label>
            <select id="courseHistorySelector" onchange="loadCourseFromHistory()"></select>
            
            <label>Course Name</label>
            <input type="text" id="classNameInput" placeholder="eg. Mechanics" oninput="refresh()">

            <label>Section</label>
            <select id="sectionInput" onchange="autoLoadLecturer(); refresh();"><option>A</option><option>B</option><option>C</option><option>D</option><option>E</option><option>F</option></select>

            <label>Lecturer</label>
            <input type="text" id="lecturerNameInput" placeholder="Enter Name">

            <label>Data Date</label>
            <input type="date" id="dateFilter" onchange="refresh()">
            
            <img id="qrImage">
            
            <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()"><i data-lucide="map-pin"></i> Sync GPS & Go Live</button>
            <button class="btn btn-green" onclick="downloadCSV()"><i data-lucide="file-down"></i> Export CSV</button>
            <button class="btn btn-red" onclick="location.reload()"><i data-lucide="log-out"></i> Logout System</button>
        </div>

        <div class="content">
            <!-- Stat Cards -->
            <div class="stats-grid">
                <div class="stat-card">
                    <div class="stat-icon" style="background: #ecfdf5; color: #10b981;"><i data-lucide="users"></i></div>
                    <div><label style="margin:0">Present</label><div style="font-size: 24px; font-weight: 800;" id="count">0</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fffbeb; color: #d97706;"><i data-lucide="book-marked"></i></div>
                    <div style="overflow: hidden;"><label style="margin:0">Active Session</label><div style="font-size: 13px; font-weight: 700; white-space: nowrap;" id="activeCourseName">---</div></div>
                </div>
                <div class="stat-card">
                    <div class="stat-icon" style="background: #fdf2f8; color: #db2777;"><i data-lucide="radio"></i></div>
                    <div><label style="margin:0">System</label><div style="font-size: 12px; font-weight: 700; color: var(--ttu-success);"><span class="pulse-dot"></span> LIVE SYNC</div></div>
                </div>
            </div>

            <h2 id="mainTitle" style="margin:0 0 5px; color: var(--ttu-blue);">Attendance Log</h2>
            <p id="subTitle" style="color:#64748b; margin-bottom: 25px; font-size: 14px; font-weight: 500;"></p>
            
            <div class="table-container">
                <table>
                    <thead><tr><th>Time</th><th>Student Full Name</th><th>Index No.</th><th>Status</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        let allSavedClasses = [];
        window.toggleSidebar = () => {
            const isAct = document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('overlay').classList.toggle('active');
            document.getElementById('mBtn').innerHTML = isAct ? '<i data-lucide="x"></i>' : '<i data-lucide="menu"></i>';
            lucide.createIcons();
        };

        window.verifyAdmin = () => {
            if (document.getElementById('adminPass').value === "TTUattendance@50") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminWrapper').style.display = "block";
                loadAllClassesFromDB(); refresh(); lucide.createIcons();
            } else alert("Access Denied");
        };

        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];
        window.contextChanged = () => { document.getElementById('classNameInput').value = ""; document.getElementById('lecturerNameInput').value = ""; updateHistoryList(); refresh(); };

        async function loadAllClassesFromDB() {
            const { data } = await supabase.from('classes').select('*').order('name');
            if (data) { allSavedClasses = data; updateHistoryList(); }
        }

        window.updateHistoryList = () => {
            const level = document.getElementById('levelInput').value, dept = document.getElementById('deptInput').value;
            const matches = allSavedClasses.filter(c => c.level === level && c.department === dept);
            const uniqueNames = [...new Set(matches.map(c => c.name))];
            const sel = document.getElementById('courseHistorySelector');
            sel.innerHTML = uniqueNames.length > 0 ? '<option value="">-- Choose Course --</option>' : '<option value="">-- No matches --</option>';
            uniqueNames.forEach(n => { const o = document.createElement('option'); o.value = n; o.innerText = n; sel.appendChild(o); });
        };

        window.loadCourseFromHistory = () => {
            const n = document.getElementById('courseHistorySelector').value;
            if (!n) return; document.getElementById('classNameInput').value = n; autoLoadLecturer();
        };

        window.autoLoadLecturer = () => {
            const n = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value;
            if (!n) return;
            const exact = allSavedClasses.find(c => c.name === n && c.section === s && c.level === l && c.department === d);
            if (exact) document.getElementById('lecturerNameInput').value = exact.lecturer_name;
            else { const hint = allSavedClasses.find(c => c.name === n && c.level === l && c.department === d); document.getElementById('lecturerNameInput').value = hint ? hint.lecturer_name : ""; }
            refresh();
        };

        window.refresh = async () => {
            const l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value, c = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, dt = document.getElementById('dateFilter').value;
            const cid = `${d}_${l}_${c.replace(/\s+/g, '_')}_${s}`.toLowerCase();
            document.getElementById('activeCourseName').innerText = c || "Waiting...";
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent('https://ttu-attendance-portal.github.io/attendance-system/?class='+cid)}`;
            if (!c) return;
            const st = `${dt}T00:00:00.000Z`, en = `${dt}T23:59:59.999Z`;
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).gte('created_at', st).lte('created_at', en).order('created_at', {ascending: false});
            document.getElementById('count').innerText = data ? data.length : 0;
            document.getElementById('mainTitle').innerText = c;
            document.getElementById('subTitle').innerText = `${d} | Level ${l} | Section ${s}`;
            if (data) document.getElementById('list').innerHTML = data.map(x => `<tr><td style="color:#64748b; font-size:12px;">${new Date(x.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${x.student}</b></td><td><code style="background:#f1f5f9; padding:4px 8px; border-radius:6px;">${x.index_number}</code></td><td><span class="verified-badge"><i data-lucide="check-circle-2" size="12"></i> VERIFIED</span></td></tr>`).join('') || "<tr><td colspan='4' style='text-align:center; padding:40px; color:#94a3b8;'>No students found.</td></tr>";
            lucide.createIcons();
        };

        window.updateRoomGPS = () => {
            const l = document.getElementById('levelInput').value, d = document.getElementById('deptInput').value, c = document.getElementById('classNameInput').value, s = document.getElementById('sectionInput').value, lec = document.getElementById('lecturerNameInput').value;
            if(!c || !lec) return alert("Fill course and lecturer details!");
            const cid = `${d}_${l}_${c.replace(/\s+/g, '_')}_${s}`.toLowerCase();
            const btn = document.getElementById('gpsBtn'); btn.innerHTML = "⏳ Syncing GPS..."; btn.disabled = true;
            navigator.geolocation.getCurrentPosition(async (p) => {
                await supabase.from('classes').upsert({ id: cid, name: c, department: d, level: l, section: s, lecturer_name: lec, lat: p.coords.latitude, lng: p.coords.longitude });
                alert("GPS Verified! Class is now Live."); if(window.innerWidth < 1024) toggleSidebar(); loadAllClassesFromDB(); refresh(); btn.innerHTML = '<i data-lucide="map-pin"></i> Sync GPS & Go Live'; btn.disabled = false;
                lucide.createIcons();
            }, (e) => { alert("GPS Lock Failed. Move to an open area."); btn.innerHTML = '<i data-lucide="map-pin"></i> Sync GPS & Go Live'; btn.disabled = false; lucide.createIcons(); }, {enableHighAccuracy:true});
        };

        window.downloadCSV = () => {
            const c = document.getElementById('classNameInput').value || "Report";
            let csv = "Time,Name,Index\n";
            document.querySelectorAll("#list tr").forEach(tr => { if (tr.cells.length > 1) csv += `${tr.cells[0].innerText},${tr.cells[1].innerText.replace(',','')},${tr.cells[2].innerText}\n`; });
            const b = new Blob([csv], { type: 'text/csv' });
            const ln = document.createElement("a"); ln.href = URL.createObjectURL(b); ln.download = `${c}_Attendance.csv`; ln.click();
        };

        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => refresh()).subscribe();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Faculty Portal | TTU Engineering</title>
    <style>
        #adminWrapper { display: none; }
        body { font-family: -apple-system, system-ui, sans-serif; background: #f8fafc; margin: 0; width: 100vw; overflow-x: hidden; }
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #004085; position: fixed; width: 100%; top: 0; z-index: 5000; }
        .login-card { background: white; padding: 2.5rem; border-radius: 1rem; width: 85%; max-width: 320px; text-align: center; }
        .sidebar { width: 300px; background: white; height: 100vh; padding: 25px; border-right: 1px solid #e2e8f0; position: fixed; top: 0; left: 0; box-sizing: border-box; overflow-y: auto; transition: transform 0.3s ease; z-index: 3000; }
        @media (max-width: 768px) { .sidebar { transform: translateX(-100%); width: 280px; } .sidebar.active { transform: translateX(0); } .content { margin-left: 0 !important; padding: 15px !important; } .menu-toggle { display: flex !important; } }
        .menu-toggle { display: none; position: fixed; bottom: 25px; right: 25px; background: #004085; color: white; border: none; width: 60px; height: 60px; border-radius: 50%; justify-content: center; align-items: center; font-size: 24px; box-shadow: 0 4px 15px rgba(0,0,0,0.3); z-index: 4000; }
        .content { margin-left: 300px; padding: 40px; }
        label { font-size: 10px; font-weight: bold; color: #64748b; display: block; margin-top: 12px; text-transform: uppercase; }
        input, select { width: 100%; padding: 10px; margin-top: 5px; border: 1px solid #ddd; border-radius: 8px; font-size: 16px; background: #fff; }
        .btn { padding: 14px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 12px; color: white; }
        .btn-blue { background: #007bff; } .btn-green { background: #10b981; } .btn-red { background: #64748b; }
        .table-container { width: 100%; overflow-x: auto; background: white; border-radius: 12px; border: 1px solid #e2e8f0; margin-top: 20px; }
        table { width: 100%; border-collapse: collapse; min-width: 500px; }
        th, td { padding: 14px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; font-size: 11px; text-transform: uppercase; }
        #qrImage { width: 160px; height: 160px; margin: 15px auto; display: block; border: 1px solid #eee; padding: 10px; border-radius: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2 style="color:#004085; margin:0;">TTU Admin</h2>
            <p style="font-size: 12px; color: #64748b; margin-bottom: 20px;">Faculty Management Portal</p>
            <input type="password" id="adminPass" placeholder="System Password">
            <button class="btn btn-blue" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <div id="adminWrapper">
        <button class="menu-toggle" id="mBtn" onclick="toggleSidebar()">☰</button>

        <div class="sidebar" id="sidebar">
            <h3 style="color:#004085; margin:0;">Faculty Portal</h3>
            
            <label>History (Select Saved Course)</label>
            <select id="courseHistorySelector" onchange="loadCourseFromHistory()">
                <option value="">-- Unique Courses --</option>
            </select>
            
            <hr style="margin:15px 0; border:0; border-top:1px solid #f1f5f9;">
            
            <label>Level</label>
            <select id="levelInput" onchange="refresh()">
                <option value="100">Level 100</option>
                <option value="200">Level 200</option>
                <option value="300">Level 300</option>
                <option value="400">Level 400</option>
            </select>

            <label>Department</label>
            <select id="deptInput" onchange="refresh()">
                <option value="Mechanical">Mechanical</option>
                <option value="Electrical">Electrical</option>
                <option value="Civil">Civil</option>
                <option value="Petroleum">Petroleum</option>
            </select>

            <label>Course Name</label>
            <input type="text" id="classNameInput" placeholder="eg. Fluid Mechanics" oninput="refresh()">

            <label>Section (Class)</label>
            <select id="sectionInput" onchange="refresh()">
                <option value="A">Class A</option><option value="B">Class B</option><option value="C">Class C</option>
                <option value="D">Class D</option><option value="E">Class E</option><option value="F">Class F</option>
            </select>

            <label>Lecturer Name</label>
            <input type="text" id="lecturerNameInput" placeholder="Dr. Appiah">

            <label>Record Date</label>
            <input type="date" id="dateFilter" onchange="refresh()">
            
            <img id="qrImage">
            
            <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()">📍 Sync GPS & Set Live</button>
            <button class="btn btn-green" onclick="downloadCSV()">📥 Export Attendance</button>
            <button class="btn btn-red" onclick="location.reload()">🔒 Logout</button>
        </div>

        <div class="content">
            <h1 id="mainTitle" style="margin:0; font-size: 24px;">Attendance Log</h1>
            <p id="subTitle" style="margin:5px 0 20px; color:#64748b;"></p>
            <div class="table-container">
                <table>
                    <thead><tr><th>Time</th><th>Student Name</th><th>Index</th><th>Status</th></tr></thead>
                    <tbody id="list"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        let allSavedClasses = [];

        window.toggleSidebar = () => {
            const isActive = document.getElementById('sidebar').classList.toggle('active');
            document.getElementById('mBtn').innerText = isActive ? '✕' : '☰';
        };

        window.verifyAdmin = () => {
            if (document.getElementById('adminPass').value === "TTUattendance@50") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminWrapper').style.display = "block";
                loadUniqueCourses(); refresh();
            } else { alert("Access Denied"); }
        };

        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];

        async function loadUniqueCourses() {
            const { data } = await supabase.from('classes').select('*').order('level').order('name');
            if (data) {
                allSavedClasses = data;
                const selector = document.getElementById('courseHistorySelector');
                selector.innerHTML = '<option value="">-- Unique Courses --</option>';
                const uniqueNames = [...new Set(data.map(c => c.name))];
                uniqueNames.forEach(name => {
                    const opt = document.createElement('option');
                    opt.value = name; opt.innerText = name;
                    selector.appendChild(opt);
                });
            }
        }

        window.loadCourseFromHistory = () => {
            const selectedName = document.getElementById('courseHistorySelector').value;
            const courseData = allSavedClasses.find(c => c.name === selectedName);
            if (courseData) {
                document.getElementById('deptInput').value = courseData.department;
                document.getElementById('levelInput').value = courseData.level || "100";
                document.getElementById('classNameInput').value = courseData.name;
                document.getElementById('lecturerNameInput').value = courseData.lecturer_name;
                refresh();
            }
        };

        window.refresh = async () => {
            const level = document.getElementById('levelInput').value;
            const dept = document.getElementById('deptInput').value;
            const course = document.getElementById('classNameInput').value;
            const sec = document.getElementById('sectionInput').value;
            const date = document.getElementById('dateFilter').value;

            // Generate unique ID using Level as well
            const cid = `${dept}_${level}_${course.replace(/\s+/g, '_')}_${sec}`.toLowerCase();
            const studentUrl = `https://ttu-attendance-portal.github.io/attendance-system/?class=${cid}`;
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(studentUrl)}`;
            
            const start = `${date}T00:00:00.000Z`, end = `${date}T23:59:59.999Z`;
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).gte('created_at', start).lte('created_at', end).order('created_at', {ascending: false});
            
            document.getElementById('mainTitle').innerText = course || "Attendance Log";
            document.getElementById('subTitle').innerText = `${dept} L${level} | Section ${sec} | ${data?.length || 0} Present`;

            if (data) {
                document.getElementById('list').innerHTML = data.map(d => `<tr><td>${new Date(d.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${d.student}</b></td><td>${d.index_number}</td><td><span style="color:green">● Verified</span></td></tr>`).join('') || "<tr><td colspan='4' style='text-align:center; padding:30px; color:#94a3b8;'>No records for this selection.</td></tr>";
            }
        };

        window.updateRoomGPS = () => {
            const btn = document.getElementById('gpsBtn');
            const level = document.getElementById('levelInput').value;
            const dept = document.getElementById('deptInput').value;
            const course = document.getElementById('classNameInput').value;
            const sec = document.getElementById('sectionInput').value;
            const lecturer = document.getElementById('lecturerNameInput').value;
            
            if(!course || !lecturer) return alert("Course and Lecturer Required");
            const cid = `${dept}_${level}_${course.replace(/\s+/g, '_')}_${sec}`.toLowerCase();

            btn.innerText = "⏳ Syncing GPS...";
            btn.disabled = true;

            navigator.geolocation.getCurrentPosition(async (pos) => {
                await supabase.from('classes').upsert({ 
                    id: cid, name: course, department: dept, level: level, section: sec, lecturer_name: lecturer, 
                    lat: pos.coords.latitude, lng: pos.coords.longitude 
                });
                alert("✅ Success! L" + level + " " + course + " is now active."); 
                if(window.innerWidth < 768) toggleSidebar();
                loadUniqueCourses(); refresh();
                btn.innerText = "📍 Sync GPS & Set Live"; btn.disabled = false;
            }, (err) => { alert("GPS Lock Failed"); btn.innerText = "📍 Sync GPS & Set Live"; btn.disabled = false; }, {enableHighAccuracy:true});
        };

        window.downloadCSV = () => {
            const course = document.getElementById('classNameInput').value;
            const level = document.getElementById('levelInput').value;
            const sec = document.getElementById('sectionInput').value;
            let csv = "Time,Name,Index\n";
            document.querySelectorAll("#list tr").forEach(tr => { if (tr.cells.length > 1) csv += `${tr.cells[0].innerText},${tr.cells[1].innerText.replace(',','')},${tr.cells[2].innerText}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `${course}_L${level}_Sec_${sec}.csv`;
            link.click();
        };

        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => refresh()).subscribe();
    </script>
</body>
</html>

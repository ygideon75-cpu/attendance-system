<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Attendance Dashboard</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root { --primary: #007bff; --bg: #f8fafc; --sidebar: #ffffff; --card: #ffffff; --text: #334155; --border: #e2e8f0; }
        body { font-family: 'Inter', sans-serif; background: var(--bg); color: var(--text); margin: 0; display: flex; min-height: 100vh; }
        .sidebar { width: 280px; background: var(--sidebar); border-right: 1px solid var(--border); padding: 2rem; position: fixed; height: 100vh; box-sizing: border-box; }
        .main-content { margin-left: 280px; padding: 2.5rem; flex-grow: 1; }
        .qr-card { background: #f8fafc; padding: 1rem; border-radius: 0.75rem; text-align: center; margin-bottom: 1.5rem; border: 1px solid var(--border); }
        #qrImage { width: 160px; height: 160px; }
        input, button { width: 100%; padding: 0.75rem; border-radius: 0.5rem; border: 1px solid var(--border); margin-bottom: 1rem; font-family: inherit; }
        button { background: var(--primary); color: white; font-weight: 700; cursor: pointer; border: none; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 10px; overflow: hidden; }
        th, td { padding: 1rem; text-align: left; border-bottom: 1px solid var(--border); }
        .stat-card { background: white; padding: 1.5rem; border-radius: 1rem; border: 1px solid var(--border); margin-bottom: 2rem; display: inline-block; min-width: 200px; }
    </style>
</head>
<body>

    <aside class="sidebar">
        <h2 style="color:var(--primary)">Dashboard</h2>
        <label style="font-size: 12px; font-weight: bold;">CLASS ID</label>
        <input type="text" id="classIdInput" value="cs101" onchange="refresh()">
        
        <div class="qr-card">
            <img id="qrImage" src="" alt="QR">
            <p style="font-size: 10px; color: #64748b;">SCAN TO MARK ATTENDANCE</p>
        </div>
        
        <button onclick="downloadCSV()" style="background:#28a745">📥 Download CSV</button>
    </aside>

    <main class="main-content">
        <div class="stat-card">
            <div style="font-size: 12px; color: #64748b;">TOTAL PRESENT</div>
            <div id="count" style="font-size: 32px; font-weight: 800; color: var(--primary);">0</div>
        </div>

        <table>
            <thead>
                <tr><th>Time</th><th>Name</th><th>Index</th></tr>
            </thead>
            <tbody id="list"></tbody>
        </table>
    </main>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        window.refresh = () => {
            const cid = document.getElementById('classIdInput').value;
            // UPDATE THIS LINK to your actual student page URL
            const url = `https://ygideon75-cpu.github.io/attendance-system/?class=${cid}`;
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=${encodeURIComponent(url)}`;
            load(cid);
        };

        async function load(cid) {
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).order('created_at', { ascending: false });
            if (data) {
                document.getElementById('count').innerText = data.length;
                document.getElementById('list').innerHTML = data.map(d => `
                    <tr>
                        <td>${new Date(d.created_at).toLocaleTimeString()}</td>
                        <td><b>${d.student}</b></td>
                        <td>${d.index_number}</td>
                    </tr>
                `).join('') || "<tr><td colspan='3' style='text-align:center'>No students yet</td></tr>";
            }
        }

        // Realtime Listener
        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => {
            load(document.getElementById('classIdInput').value);
        }).subscribe();

        window.downloadCSV = () => {
            let csv = "Time,Name,Index\n";
            document.querySelectorAll("#list tr").forEach(tr => {
                if(tr.cells.length >= 3) csv += `${tr.cells[0].innerText},${tr.cells[1].innerText},${tr.cells[2].innerText}\n`;
            });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = "attendance.csv";
            link.click();
        };

        refresh();
    </script>
</body>
</html>

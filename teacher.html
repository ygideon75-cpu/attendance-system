<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin | TTU Attendance Portal</title>
    <style>
        #adminWrapper { display: none; }
        body { font-family: 'Segoe UI', sans-serif; background: #f8fafc; margin: 0; }
        .login-screen { display: flex; justify-content: center; align-items: center; height: 100vh; background: #004085; }
        .login-card { background: white; padding: 2.5rem; border-radius: 1rem; width: 320px; text-align: center; box-shadow: 0 10px 25px rgba(0,0,0,0.2); }
        .sidebar { width: 320px; background: white; height: 100vh; padding: 25px; border-right: 1px solid #e2e8f0; position: fixed; box-sizing: border-box; }
        .content { margin-left: 320px; padding: 40px; flex-grow: 1; }
        input, select { width: 100%; padding: 12px; margin-top: 8px; border: 1px solid #ddd; border-radius: 8px; box-sizing: border-box; }
        .btn { padding: 12px; width: 100%; border: none; border-radius: 8px; cursor: pointer; font-weight: bold; margin-top: 15px; color: white; }
        .btn-blue { background: #007bff; }
        .btn-green { background: #10b981; }
        table { width: 100%; border-collapse: collapse; background: white; border-radius: 12px; overflow: hidden; }
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #f1f5f9; }
        th { background: #f8fafc; color: #64748b; font-size: 11px; text-transform: uppercase; }
        #qrImage { width: 180px; margin: 20px auto; display: block; border: 1px solid #eee; border-radius: 10px; padding: 10px; }
    </style>
</head>
<body>

    <div id="loginScreen" class="login-screen">
        <div class="login-card">
            <h2>TTU Admin</h2>
            <input type="password" id="adminPass" placeholder="System Password">
            <button class="btn btn-blue" onclick="verifyAdmin()">Login</button>
        </div>
    </div>

    <div id="adminWrapper">
        <div class="sidebar">
            <h2 style="color:#004085">TTU Dashboard</h2>
            <label>Load History</label>
            <select id="classSelector" onchange="selectSavedClass()"></select>
            <hr style="margin:20px 0; border:0; border-top:1px solid #eee;">
            <label>Class ID</label>
            <input type="text" id="classIdInput" value="cs101" onchange="refresh()">
            <label>Course Name</label>
            <input type="text" id="classNameInput" placeholder="eg. Advanced Java">
            <label>Date</label>
            <input type="date" id="dateFilter" onchange="refresh()">
            <img id="qrImage">
            <button class="btn btn-blue" id="gpsBtn" onclick="updateRoomGPS()">📍 Set GPS & Start Class</button>
            <button class="btn btn-green" onclick="downloadCSV()">📥 Export CSV</button>
            <button class="btn" style="background:#64748b" onclick="location.reload()">Logout</button>
        </div>
        <div class="content">
            <h1>Attendance List (<span id="count">0</span>)</h1>
            <table>
                <thead><tr><th>Time</th><th>Name</th><th>Index</th><th>Location</th></tr></thead>
                <tbody id="list"></tbody>
            </table>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        window.verifyAdmin = () => {
            if (document.getElementById('adminPass').value === "TTUattendance@50") {
                document.getElementById('loginScreen').style.display = "none";
                document.getElementById('adminWrapper').style.display = "flex";
                loadClassHistory(); refresh();
            } else { alert("Wrong Password!"); }
        };

        document.getElementById('dateFilter').value = new Date().toISOString().split('T')[0];

        async function loadClassHistory() {
            const { data } = await supabase.from('classes').select('id, name').order('name');
            const selector = document.getElementById('classSelector');
            selector.innerHTML = '<option value="">-- Choose Class --</option>';
            data?.forEach(c => {
                const opt = document.createElement('option');
                opt.value = c.id; opt.innerText = `${c.name} (${c.id})`;
                selector.appendChild(opt);
            });
        }

        window.selectSavedClass = () => {
            const val = document.getElementById('classSelector').value;
            if (val) { document.getElementById('classIdInput').value = val; refresh(); }
        };

        window.refresh = async () => {
            const cid = document.getElementById('classIdInput').value;
            const date = document.getElementById('dateFilter').value;
            document.getElementById('qrImage').src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent('https://ygideon75-cpu.github.io/attendance-system/?class='+cid)}`;
            
            const start = `${date}T00:00:00.000Z`, end = `${date}T23:59:59.999Z`;
            const { data } = await supabase.from('attendance').select('*').eq('class_id', cid).gte('created_at', start).lte('created_at', end).order('created_at', {ascending: false});
            if (data) {
                document.getElementById('count').innerText = data.length;
                document.getElementById('list').innerHTML = data.map(d => `<tr><td>${new Date(d.created_at).toLocaleTimeString([],{hour:'2-digit',minute:'2-digit'})}</td><td><b>${d.student}</b></td><td>${d.index_number}</td><td><a href="https://www.google.com/maps?q=${d.lat},${d.lng}" target="_blank">📍 View Map</a></td></tr>`).join('');
            }
        };

        window.updateRoomGPS = () => {
            const cid = document.getElementById('classIdInput').value;
            const cName = document.getElementById('classNameInput').value;
            if(!cName) return alert("Please enter Course Name!");
            navigator.geolocation.getCurrentPosition(async (pos) => {
                await supabase.from('classes').upsert({ id: cid, name: cName, lat: pos.coords.latitude, lng: pos.coords.longitude });
                alert("Room GPS set successfully!"); loadClassHistory(); refresh();
            }, (err) => alert("GPS Error: " + err.message), {enableHighAccuracy:true});
        };

        window.downloadCSV = () => {
            let csv = "Time,Name,Index\n";
            document.querySelectorAll("#list tr").forEach(tr => { if (tr.cells.length > 1) csv += `${tr.cells[0].innerText},${tr.cells[1].innerText},${tr.cells[2].innerText}\n`; });
            const blob = new Blob([csv], { type: 'text/csv' });
            const link = document.createElement("a");
            link.href = URL.createObjectURL(blob);
            link.download = `Attendance_${document.getElementById('classIdInput').value}.csv`;
            link.click();
        };

        supabase.channel('db').on('postgres_changes', { event: 'INSERT', schema: 'public', table: 'attendance' }, () => refresh()).subscribe();
    </script>
</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>

        h2 { margin-bottom: 1.5rem; color: var(--primary); }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 1rem; border-radius: 0.5rem; border: none; background: var(--primary); color: white; font-weight: 700; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        #status { margin-top: 1rem; font-size: 0.9rem; font-weight: 500; }
        .success { color: #28a745; }

</head>

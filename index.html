<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f1f5f9; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 400px; text-align: center; }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-sizing: border-box; font-size: 1rem; }
        button { width: 100%; padding: 1rem; border: none; border-radius: 0.5rem; background: #007bff; color: white; font-weight: bold; cursor: pointer; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; }
        #status { font-size: 0.85rem; margin-top: 15px; font-weight: 600; color: #dc2626; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <h2 id="title">Class: Loading...</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="index" placeholder="Index Number">
        <div id="status">⏳ Verifying Identity...</div>
        <button id="btn" onclick="submitAttendance()" disabled>OUT OF RANGE</button>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        const params = new URLSearchParams(window.location.search);
        const classId = params.get('class') || 'cs101';
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('title').innerText = "Class: " + classId.toUpperCase();

        // --- 1. HARDWARE FINGERPRINTING ---
        // This identifies the physical phone even in Incognito
        function getFingerprint() {
            const canvas = document.createElement('canvas');
            const ctx = canvas.getContext('2d');
            ctx.textBaseline = "top";
            ctx.font = "14px 'Arial'";
            ctx.fillText("Attendance_ID", 2, 2);
            return btoa(canvas.toDataURL()); // Converts unique hardware drawing to a string
        }
        const hardwareId = getFingerprint();

        let sLat, sLng;

        // --- 2. GPS & DB CHECK ---
        navigator.geolocation.watchPosition(async (pos) => {
            sLat = pos.coords.latitude;
            sLng = pos.coords.longitude;

            // Check if this physical phone already submitted today
            const startOfDay = `${today}T00:00:00.000Z`;
            const { data: alreadyScanned } = await supabase
                .from('attendance')
                .select('id')
                .eq('device_id', hardwareId)
                .eq('class_id', classId)
                .gte('created_at', startOfDay);

            if (alreadyScanned && alreadyScanned.length > 0) {
                document.getElementById('mainCard').innerHTML = "<h2>❌ Device Locked</h2><p>You cannot sign in for a friend. Only one scan per phone is allowed.</p>";
                return;
            }

            const { data: cData } = await supabase.from('classes').select('*').eq('id', classId).single();
            if (cData && cData.lat) {
                const dist = getDist(sLat, sLng, cData.lat, cData.lng);
                if (dist <= 0.1) {
                    document.getElementById('status').innerText = "📍 In Range";
                    document.getElementById('status').style.color = "green";
                    document.getElementById('btn').disabled = false;
                    document.getElementById('btn').innerText = "Mark Present";
                } else {
                    document.getElementById('status').innerText = `❌ Too Far (${Math.round(dist*1000)}m)`;
                    document.getElementById('btn').disabled = true;
                }
            }
        }, null, { enableHighAccuracy: true });

        function getDist(la1, lo1, la2, lo2) {
            const R = 6371; 
            const dLat = (la2-la1)*Math.PI/180;
            const dLon = (lo2-lo1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.submitAttendance = async () => {
            const name = document.getElementById('name').value;
            const index = document.getElementById('index').value;
            if(!name || !index) return alert("Fill fields");

            const btn = document.getElementById('btn');
            btn.disabled = true;
            btn.innerText = "Verifying...";

            // Final check for Index Number duplicate
            const startOfDay = `${today}T00:00:00.000Z`;
            const { data: indexUsed } = await supabase
                .from('attendance')
                .select('id')
                .eq('index_number', index)
                .eq('class_id', classId)
                .gte('created_at', startOfDay);

            if (indexUsed && indexUsed.length > 0) {
                alert("This Index Number has already been used today!");
                btn.disabled = false;
                return;
            }

            const { error } = await supabase.from('attendance').insert([{ 
                student: name, 
                index_number: index, 
                class_id: classId, 
                lat: sLat, 
                lng: sLng,
                device_id: hardwareId 
            }]);

            if (!error) {
                document.getElementById('mainCard').innerHTML = "<h2>✅ Success!</h2>";
            } else {
                alert(error.message);
                btn.disabled = false;
            }
        };
    </script>
</body>
</html>

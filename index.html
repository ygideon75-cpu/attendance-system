<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mark Attendance</title>
    <style>
        body { font-family: -apple-system, sans-serif; display: flex; justify-content: center; align-items: center; min-height: 100vh; margin: 0; background: #f1f5f9; }
        .card { background: white; padding: 2.5rem; border-radius: 1.5rem; box-shadow: 0 10px 25px rgba(0,0,0,0.05); width: 90%; max-width: 400px; text-align: center; }
        button { width: 100%; padding: 1rem; border: none; border-radius: 0.5rem; background: #007bff; color: white; font-weight: bold; cursor: pointer; font-size: 1rem; }
        button:disabled { background: #cbd5e1; cursor: not-allowed; color: #64748b; }
        #status { font-size: 0.9rem; margin-top: 15px; font-weight: bold; }
        #debug { font-size: 0.7rem; color: #64748b; margin-top: 15px; background: #f8fafc; padding: 10px; border-radius: 8px; text-align: left; }
        input { width: 100%; padding: 0.8rem; margin-bottom: 1rem; border: 1px solid #e2e8f0; border-radius: 0.5rem; box-sizing: border-box; }
    </style>
</head>
<body>
    <div class="card" id="mainCard">
        <h2 id="title">Class: Loading...</h2>
        <input type="text" id="name" placeholder="Full Name">
        <input type="text" id="index" placeholder="Index Number">
        
        <div id="status">⏳ Verifying Location...</div>
        <button id="btn" onclick="submitAttendance()" disabled>OUT OF RANGE</button>

        <div id="debug">
            <b>GPS Figures:</b><br>
            My Lat: <span id="myLat">...</span><br>
            My Lng: <span id="myLng">...</span><br><br>
            Room Lat: <span id="roomLat">...</span><br>
            Room Lng: <span id="roomLng">...</span>
        </div>
    </div>

    <script type="module">
        import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'
        const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

        const params = new URLSearchParams(window.location.search);
        const classId = params.get('class') || 'cs101';
        const today = new Date().toISOString().split('T')[0];
        document.getElementById('title').innerText = "Class: " + classId.toUpperCase();

        if (localStorage.getItem('attendance_' + classId) === today) {
            document.getElementById('mainCard').innerHTML = "<h2>✅ Already Marked Today</h2>";
        }

        let sLat, sLng;

        // Watch position in real-time
        navigator.geolocation.watchPosition(async (pos) => {
            sLat = pos.coords.latitude;
            sLng = pos.coords.longitude;
            document.getElementById('myLat').innerText = sLat.toFixed(5);
            document.getElementById('myLng').innerText = sLng.toFixed(5);

            const { data: cData } = await supabase.from('classes').select('*').eq('id', classId).single();

            if (cData && cData.lat) {
                document.getElementById('roomLat').innerText = cData.lat.toFixed(5);
                document.getElementById('roomLng').innerText = cData.lng.toFixed(5);

                const dist = getDist(sLat, sLng, cData.lat, cData.lng);
                const meters = Math.round(dist * 1000);
                
                // --- RADIUS LIMIT: 0.1 KM = 100 METERS ---
                if (dist <= 0.1) { 
                    document.getElementById('status').innerText = `📍 In Range (${meters}m)`;
                    document.getElementById('status').style.color = "#16a34a";
                    document.getElementById('btn').disabled = false;
                    document.getElementById('btn').innerText = "Mark Present";
                } else {
                    document.getElementById('status').innerText = `❌ Too Far (${meters}m)`;
                    document.getElementById('status').style.color = "#dc2626";
                    document.getElementById('btn').disabled = true;
                    document.getElementById('btn').innerText = "OUT OF RANGE";
                }
            } else {
                document.getElementById('status').innerText = "⚠️ Room location NOT SET by teacher.";
            }
        }, (err) => {
            document.getElementById('status').innerText = "❌ GPS Error. Enable location.";
        }, { enableHighAccuracy: true });

        // Haversine formula for distance
        function getDist(la1, lo1, la2, lo2) {
            const R = 6371; 
            const dLat = (la2-la1)*Math.PI/180;
            const dLon = (lo2-lo1)*Math.PI/180;
            const a = Math.sin(dLat/2)**2 + Math.cos(la1*Math.PI/180)*Math.cos(la2*Math.PI/180)*Math.sin(dLon/2)**2;
            return R * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1-a));
        }

        window.submitAttendance = async () => {
            const name = document.getElementById('name').value;
            const index = document.getElementById('index').value;
            if(!name || !index) return alert("Fill fields");

            const { error } = await supabase.from('attendance').insert([{ 
                student: name, 
                index_number: index, 
                class_id: classId, 
                lat: sLat, 
                lng: sLng 
            }]);

            if (!error) {
                localStorage.setItem('attendance_' + classId, today);
                document.getElementById('mainCard').innerHTML = "<h2>✅ Success!</h2><p>Attendance recorded.</p>";
            } else {
                alert("Error: " + error.message);
            }
        };
    </script>
</body>
</html>

<script type="module">
    import { createClient } from 'https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/+esm'

    const supabase = createClient('https://tnscsgqogoqrwdohytki.supabase.co', 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InRuc2NzZ3FvZ29xcndkb2h5dGtpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3Nzk2MTcwMjQsImV4cCI6MjA5NTE5MzAyNH0.Xy-QKWBrYXIMP7M_lBmW4SnUxlBpnbm_Poatd8W5Ph4');

    const params = new URLSearchParams(window.location.search);
    const classId = params.get('class') || 'cs101';
    document.getElementById('title').innerText = "Class: " + classId.toUpperCase();

    let studentLat = null;
    let studentLng = null;

    // Get location as soon as page loads
    navigator.geolocation.getCurrentPosition((pos) => {
        studentLat = pos.coords.latitude;
        studentLng = pos.coords.longitude;
    }, (err) => {
        alert("Please enable GPS/Location to mark attendance.");
    });

    window.submitAttendance = async () => {
        const name = document.getElementById('name').value;
        const index = document.getElementById('index').value;
        const btn = document.getElementById('btn');

        if(!name || !index) return alert("Please fill all fields");
        if(!studentLat) return alert("Still detecting location... please wait a second.");

        btn.disabled = true;
        btn.innerText = "Saving...";

        const { error } = await supabase.from('attendance').insert([{
            student: name,
            index_number: index,
            class_id: classId,
            lat: studentLat, // Saves student Latitude
            lng: studentLng  // Saves student Longitude
        }]);

        if (error) {
            alert("Error: " + error.message);
            btn.disabled = false;
        } else {
            document.body.innerHTML = "<h1>✅ Success! Attendance marked with GPS.</h1>";
        }
    };
</script>
